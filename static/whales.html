<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Monitor - Whale Alerts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .nav {
            margin-bottom: 20px;
        }
        .nav a {
            color: #58a6ff;
            text-decoration: none;
            margin-right: 20px;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 .whale-icon {
            font-size: 2rem;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .controls button:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .controls button.active {
            background: #238636;
            border-color: #238636;
        }
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .filter-group label {
            color: #8b949e;
            font-size: 0.85rem;
        }
        .filter-group select {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .last-update {
            color: #8b949e;
            font-size: 0.85rem;
            margin-left: auto;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }
        .stat-label {
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #58a6ff;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'SF Mono', Monaco, monospace;
        }
        .stat-value.whale {
            color: #a371f7;
        }
        .alert-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .alert-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s;
        }
        .alert-card:hover {
            border-color: #8b949e;
            background: #1c2128;
        }
        .alert-card.unread {
            border-left: 3px solid #a371f7;
        }
        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .alert-title {
            font-weight: 600;
            color: #c9d1d9;
            font-size: 1rem;
        }
        .alert-time {
            color: #8b949e;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .alert-message {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .alert-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .alert-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #21262d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .alert-tag.amount {
            background: #238636;
            color: #fff;
        }
        .alert-tag.severity-high {
            background: #f8514926;
            color: #f85149;
        }
        .alert-tag.severity-medium {
            background: #d29922;
            color: #0d1117;
        }
        .alert-tag.severity-low {
            background: #21262d;
            color: #8b949e;
        }
        .alert-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        .alert-actions button {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .alert-actions button:hover {
            background: #21262d;
            color: #c9d1d9;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #8b949e;
        }
        .error {
            background: #f8514926;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        .empty-state h3 {
            color: #c9d1d9;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            .alert-header {
                flex-direction: column;
                gap: 5px;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/">← Rankings</a>
            <a href="/docs">API Docs</a>
        </nav>

        <h1><span class="whale-icon">🐋</span> Whale Alerts</h1>
        <p class="subtitle">Large trades detected in the last 48 hours</p>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Whale Trades</div>
                <div class="stat-value whale" id="total-alerts">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="total-volume">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Largest Trade</div>
                <div class="stat-value" id="largest-trade">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unread Alerts</div>
                <div class="stat-value" id="unread-count">-</div>
            </div>
        </div>

        <div class="controls">
            <button id="refresh-btn" onclick="refreshData()">↻ Refresh</button>
            <button id="auto-refresh-btn" onclick="toggleAutoRefresh()">Auto-refresh: OFF</button>
            <div class="filter-group">
                <label>Severity:</label>
                <select id="severity-filter" onchange="refreshData()">
                    <option value="">All</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
            <span class="last-update">Last update: <span id="last-update">-</span></span>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading">Loading whale alerts...</div>
        <div id="empty" class="empty-state" style="display: none;">
            <div class="icon">🐋</div>
            <h3>No whale alerts yet</h3>
            <p>Large trades will appear here when detected.<br>Threshold: $5,000+ per trade</p>
        </div>
        <div id="alert-list" class="alert-list" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let autoRefreshInterval = null;

        function formatVolume(volume) {
            if (!volume) return '-';
            if (volume >= 1000000) {
                return '$' + (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return '$' + (volume / 1000).toFixed(1) + 'K';
            }
            return '$' + volume.toFixed(0);
        }

        function formatTime(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function getSeverityClass(severity) {
            return `severity-${severity || 'low'}`;
        }

        async function fetchAlerts() {
            const response = await fetch(`${API_BASE}/alerts?alert_type=whale_trade&limit=100`);
            if (!response.ok) throw new Error('Failed to fetch alerts');
            return await response.json();
        }

        async function acknowledgeAlert(alertId) {
            const response = await fetch(`${API_BASE}/alerts/${alertId}/acknowledge`, {
                method: 'POST'
            });
            if (response.ok) {
                refreshData();
            }
        }

        async function refreshData() {
            const loading = document.getElementById('loading');
            const alertList = document.getElementById('alert-list');
            const empty = document.getElementById('empty');
            const error = document.getElementById('error');
            const severityFilter = document.getElementById('severity-filter').value;

            try {
                error.style.display = 'none';

                let alerts = await fetchAlerts();

                // Filter to last 48 hours
                const cutoff = new Date(Date.now() - 48 * 60 * 60 * 1000);
                alerts = alerts.filter(a => new Date(a.created_at) > cutoff);

                // Apply severity filter
                if (severityFilter) {
                    alerts = alerts.filter(a => a.severity === severityFilter);
                }

                // Calculate stats
                const totalAlerts = alerts.length;
                const unreadCount = alerts.filter(a => !a.acknowledged).length;
                let totalVolume = 0;
                let largestTrade = 0;

                alerts.forEach(alert => {
                    if (alert.data && alert.data.amount) {
                        totalVolume += alert.data.amount;
                        if (alert.data.amount > largestTrade) {
                            largestTrade = alert.data.amount;
                        }
                    }
                });

                document.getElementById('total-alerts').textContent = totalAlerts;
                document.getElementById('total-volume').textContent = formatVolume(totalVolume);
                document.getElementById('largest-trade').textContent = formatVolume(largestTrade);
                document.getElementById('unread-count').textContent = unreadCount;

                // Update timestamp
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

                loading.style.display = 'none';

                if (alerts.length === 0) {
                    empty.style.display = 'block';
                    alertList.style.display = 'none';
                    return;
                }

                empty.style.display = 'none';
                alertList.style.display = 'flex';

                // Build alert cards
                let html = '';
                alerts.forEach(alert => {
                    const amount = alert.data?.amount ? formatVolume(alert.data.amount) : '';
                    const market = alert.data?.market || '';
                    const unreadClass = alert.acknowledged ? '' : 'unread';

                    html += `
                        <div class="alert-card ${unreadClass}">
                            <div class="alert-header">
                                <div class="alert-title">${alert.title}</div>
                                <div class="alert-time">${formatTime(alert.created_at)}</div>
                            </div>
                            <div class="alert-message">${alert.message}</div>
                            <div class="alert-meta">
                                ${amount ? `<span class="alert-tag amount">💰 ${amount}</span>` : ''}
                                <span class="alert-tag ${getSeverityClass(alert.severity)}">${alert.severity || 'low'}</span>
                                ${market ? `<span class="alert-tag">📊 ${market.substring(0, 40)}...</span>` : ''}
                            </div>
                            ${!alert.acknowledged ? `
                                <div class="alert-actions">
                                    <button onclick="acknowledgeAlert(${alert.id})">✓ Mark as read</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                alertList.innerHTML = html;

            } catch (err) {
                console.error('Error:', err);
                error.textContent = 'Error loading alerts: ' + err.message;
                error.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('auto-refresh-btn');
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                btn.textContent = 'Auto-refresh: OFF';
                btn.classList.remove('active');
            } else {
                autoRefreshInterval = setInterval(refreshData, 30000);
                btn.textContent = 'Auto-refresh: ON (30s)';
                btn.classList.add('active');
            }
        }

        // Initial load
        refreshData();
    </script>
</body>
</html>
