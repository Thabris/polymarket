<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Monitor - Top 25 Rankings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .controls button:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .controls button.active {
            background: #238636;
            border-color: #238636;
        }
        .last-update {
            color: #8b949e;
            font-size: 0.85rem;
            margin-left: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #21262d;
        }
        th {
            background: #21262d;
            color: #8b949e;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background: #1c2128;
        }
        .rank {
            font-weight: bold;
            color: #58a6ff;
            width: 50px;
        }
        .rank-change {
            width: 80px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .rank-up {
            color: #3fb950;
        }
        .rank-down {
            color: #f85149;
        }
        .rank-same {
            color: #8b949e;
        }
        .rank-new {
            color: #a371f7;
        }
        .question {
            max-width: 500px;
        }
        .question a {
            color: #c9d1d9;
            text-decoration: none;
        }
        .question a:hover {
            color: #58a6ff;
            text-decoration: underline;
        }
        .price {
            font-family: 'SF Mono', Monaco, monospace;
            color: #7ee787;
        }
        .volume {
            font-family: 'SF Mono', Monaco, monospace;
            text-align: right;
        }
        .volume-change {
            font-size: 0.85rem;
            margin-top: 2px;
        }
        .volume-up {
            color: #3fb950;
        }
        .volume-down {
            color: #f85149;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #8b949e;
        }
        .error {
            background: #f8514926;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }
        .stat-label {
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #58a6ff;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'SF Mono', Monaco, monospace;
        }
        @media (max-width: 768px) {
            .question {
                max-width: 200px;
            }
            th, td {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/assets/style.css">
</head>
<body>
<script src="/static/assets/nav.js" data-active="rankings"></script>
    <div class="container">
        <nav class="nav" style="margin-bottom: 20px;">
            <a href="/whales" style="color: #a371f7; text-decoration: none; margin-right: 20px;">🐋 Whale Alerts</a>
            <a href="/docs" style="color: #58a6ff; text-decoration: none;">API Docs</a>
        </nav>

        <h1>Polymarket Top 25 Rankings</h1>
        <p class="subtitle">Track volume changes and rank movements in real-time</p>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Volume (24h)</div>
                <div class="stat-value" id="total-volume">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Biggest Mover</div>
                <div class="stat-value" id="biggest-mover">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">New Entries</div>
                <div class="stat-value" id="new-entries">-</div>
            </div>
        </div>

        <div class="controls">
            <button id="refresh-btn" onclick="refreshData()">↻ Refresh</button>
            <button id="auto-refresh-btn" onclick="toggleAutoRefresh()">Auto-refresh: OFF</button>
            <span class="last-update">Last update: <span id="last-update">-</span></span>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="loading" class="loading">Loading markets...</div>

        <table id="rankings-table" style="display: none;">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Change</th>
                    <th>Market</th>
                    <th>Yes Price</th>
                    <th style="text-align: right;">24h Volume</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = '/api';
        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        let previousRankings = {};
        let previousVolumes = {};
        let autoRefreshInterval = null;
        let isFirstLoad = true;

        function formatVolume(volume) {
            if (volume >= 1000000000) {
                return '$' + (volume / 1000000000).toFixed(2) + 'B';
            } else if (volume >= 1000000) {
                return '$' + (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return '$' + (volume / 1000).toFixed(1) + 'K';
            }
            return '$' + volume.toFixed(0);
        }

        function formatPrice(price) {
            if (price === null || price === undefined) return '-';
            return (price * 100).toFixed(1) + '¢';
        }

        function formatVolumeChange(current, previous) {
            if (!previous) return '';
            const change = ((current - previous) / previous) * 100;
            if (Math.abs(change) < 0.1) return '';
            const sign = change > 0 ? '+' : '';
            const cls = change > 0 ? 'volume-up' : 'volume-down';
            return `<div class="volume-change ${cls}">${sign}${change.toFixed(1)}%</div>`;
        }

        function getRankChangeDisplay(marketId, currentRank) {
            if (isFirstLoad || !previousRankings[marketId]) {
                if (isFirstLoad) return '<span class="rank-same">-</span>';
                return '<span class="rank-new">NEW</span>';
            }

            const prevRank = previousRankings[marketId];
            const diff = prevRank - currentRank;

            if (diff > 0) {
                return `<span class="rank-up">▲ ${diff}</span>`;
            } else if (diff < 0) {
                return `<span class="rank-down">▼ ${Math.abs(diff)}</span>`;
            }
            return '<span class="rank-same">-</span>';
        }

        async function fetchMarkets() {
            const response = await fetch(`${API_BASE}/markets/trending?limit=25`);
            if (!response.ok) throw new Error('Failed to fetch markets');
            return await response.json();
        }

        async function refreshData() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('rankings-table');
            const error = document.getElementById('error');
            const tbody = document.getElementById('table-body');

            try {
                error.style.display = 'none';

                const markets = await fetchMarkets();

                // Calculate stats
                const totalVolume = markets.reduce((sum, m) => sum + (m.volume_24h || 0), 0);
                document.getElementById('total-volume').textContent = formatVolume(totalVolume);

                // Find biggest mover
                let biggestMover = { change: 0, name: '-' };
                let newEntries = 0;

                markets.forEach((market, index) => {
                    const currentRank = index + 1;
                    if (!isFirstLoad && !previousRankings[market.id]) {
                        newEntries++;
                    } else if (!isFirstLoad && previousRankings[market.id]) {
                        const change = Math.abs(previousRankings[market.id] - currentRank);
                        if (change > biggestMover.change) {
                            biggestMover = {
                                change: change,
                                name: market.question.substring(0, 30) + '...',
                                direction: previousRankings[market.id] > currentRank ? '▲' : '▼'
                            };
                        }
                    }
                });

                document.getElementById('biggest-mover').textContent =
                    biggestMover.change > 0 ? `${biggestMover.direction}${biggestMover.change}` : '-';
                document.getElementById('new-entries').textContent = isFirstLoad ? '-' : newEntries;

                // Build table rows
                let html = '';
                markets.forEach((market, index) => {
                    const rank = index + 1;
                    const rankChange = getRankChangeDisplay(market.id, rank);
                    const volumeChange = formatVolumeChange(market.volume_24h, previousVolumes[market.id]);

                    const marketUrl = market.slug
                        ? `https://polymarket.com/event/${encodeURIComponent(market.slug)}`
                        : `https://polymarket.com`;

                    html += `
                        <tr>
                            <td class="rank">#${rank}</td>
                            <td class="rank-change">${rankChange}</td>
                            <td class="question">
                                <a href="${esc(marketUrl)}" target="_blank" rel="noopener">
                                    ${esc(market.question)}
                                </a>
                            </td>
                            <td class="price">${formatPrice(market.price_yes)}</td>
                            <td class="volume">
                                ${formatVolume(market.volume_24h || 0)}
                                ${volumeChange}
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

                // Store current rankings for next comparison
                const newRankings = {};
                const newVolumes = {};
                markets.forEach((market, index) => {
                    newRankings[market.id] = index + 1;
                    newVolumes[market.id] = market.volume_24h;
                });
                previousRankings = newRankings;
                previousVolumes = newVolumes;
                isFirstLoad = false;

                // Update timestamp
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

                loading.style.display = 'none';
                table.style.display = 'table';

            } catch (err) {
                console.error('Error:', err);
                error.textContent = 'Error loading data: ' + err.message;
                error.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('auto-refresh-btn');
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                btn.textContent = 'Auto-refresh: OFF';
                btn.classList.remove('active');
            } else {
                autoRefreshInterval = setInterval(refreshData, 30000); // 30 seconds
                btn.textContent = 'Auto-refresh: ON (30s)';
                btn.classList.add('active');
            }
        }

        // Initial load
        refreshData();
    </script>
</body>
</html>
